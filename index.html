<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .nav-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
            text-align: center;
        }
        /* Hover interactivity ✨ */
        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #3498db;
        }
        .nav-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
        }
        .nav-card p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website 👋</h1>
        <p>Select a page below to explore my work:</p>
    </header>

    <main class="nav-grid">
        <a href="about.html" class="nav-card">
            <h2>👤 About Me</h2>
            <p>This is some projects for my PhD literature review <img src="https://flagcdn.com" srcset="https://flagcdn.com/48x36/my.png 2x" width="24" height="18" alt="Malaysia"></p>
        </a>

        <a href="lp_accuracy.html" class="nav-card">
            <h2>📁 Learning Performance Benchmark Accuracy </h2>
            <p>.... . .</p>
        </a>

       <a href="la_dash.html" class="nav-card">
            <h2>📁 Learning Analytics Dashboard </h2>
            <p>.... ..</p>
        </a>

        <a href="contact.html" class="nav-card">
            <h2>✉️ Contact</h2>
            <p>Get in touch or drop a message.</p>
        </a>
    </main>
</body>
</html>
